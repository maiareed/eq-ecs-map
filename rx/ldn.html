<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equilibria Rx Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var t = localStorage.getItem('eq-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="eq.css">
<link rel="stylesheet" href="eq-story.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html"></a>
  <button class="theme-toggle" type="button"></button>
  <main id="app" aria-live="polite"></main>
</div>
<script src="eq-body.js"></script>
<script src="eq.js"></script>
<script src="eq-story.js"></script>
<script>EQ.story('ldn');</script>
</body>
</html>
